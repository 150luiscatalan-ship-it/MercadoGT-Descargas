name: Publicar APK firmado Mercado GT 249
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publicar-apk249.yml'

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Descargar APK compilado y certificado
        env:
          SOURCE_URL: 'https://sdmntpreastus3.oaiusercontent.com/files/00000000-f1bc-8212-8700-e71a4717dbd3/raw?se=2026-11-13T03%3A20%3A45Z&sp=r&sv=2026-06-06&sr=b&scid=bf7a1215-e8d3-5232-be48-5981c15e7f31&skoid=c953efd6-2ae8-41b4-a6d6-34b1475ac07c&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-12T13%3A41%3A12Z&ske=2026-11-13T13%3A41%3A12Z&sks=b&skv=2026-06-06&sig=oIsvb1Ktt4SVnJhPmDnhA2gbCqX9nxO%2BLyT25gReow4%3D'
        run: |
          set -euo pipefail
          mkdir -p dist
          curl --fail --location --retry 3 --silent --show-error "$SOURCE_URL" -o /tmp/MercadoGT249_artifact.zip
          unzip -t /tmp/MercadoGT249_artifact.zip >/dev/null
          unzip -q /tmp/MercadoGT249_artifact.zip -d dist
          test -s dist/MercadoGT_249_ANDROID_HISTORIAL_PRODUCTOS_VENDER.apk
          test -s dist/MercadoGT_249_ANDROID_HISTORIAL_PRODUCTOS_VENDER.apk.sha256
          test -s dist/MercadoGT_249_ANDROID_HISTORIAL_PRODUCTOS_VENDER.apk.cert.sha256
          cd dist
          sed -i 's|dist/||g' MercadoGT_249_ANDROID_HISTORIAL_PRODUCTOS_VENDER.apk.sha256
          sha256sum -c MercadoGT_249_ANDROID_HISTORIAL_PRODUCTOS_VENDER.apk.sha256
          test "$(cat MercadoGT_249_ANDROID_HISTORIAL_PRODUCTOS_VENDER.apk.cert.sha256)" = "abff6095a44e3428073de50b7cd1d8a6c2e3620e3bda58e2431ae489c633453d"
          unzip -t MercadoGT_249_ANDROID_HISTORIAL_PRODUCTOS_VENDER.apk >/dev/null

      - name: Publicar APK en descarga directa de GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=mercadogt-249
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" dist/MercadoGT_249_ANDROID_HISTORIAL_PRODUCTOS_VENDER.apk dist/MercadoGT_249_ANDROID_HISTORIAL_PRODUCTOS_VENDER.apk.sha256 --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Mercado GT 249 — Descargar APK Android" \
              --notes "APK piloto Mercado GT 249 Android, firmado con la clave original y actualizable sobre la aplicacion principal. Nuevo historial de ventas con filtros, anuladas y CSV para Excel; busqueda de productos con precio y existencias; controles tactiles de Vender. Se conserva el motor de cobro, la separacion de Vender y Dar fiado, los datos existentes, las pantallas de Productos 245 y los 35 negocios permanecen retirados. Respalda productos, ventas e inventario antes de instalar. Pendiente prueba real en Redmi." \
              --prerelease \
              dist/MercadoGT_249_ANDROID_HISTORIAL_PRODUCTOS_VENDER.apk \
              dist/MercadoGT_249_ANDROID_HISTORIAL_PRODUCTOS_VENDER.apk.sha256
          fi
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json url,assets --jq '{url:.url,archivos:[.assets[].name]}'
