name: Publicar APK firmado Mercado GT 250
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publicar-apk250.yml'

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Descargar APK compilado y certificado
        env:
          SOURCE_URL: 'https://sdmntpreastus3.oaiusercontent.com/files/00000000-1e04-8212-9e12-44987822592f/raw?se=2026-11-13T04%3A40%3A19Z&sp=r&sv=2026-06-06&sr=b&scid=9cbfa9fb-905f-5c78-8034-0726ee54bfed&skoid=c953efd6-2ae8-41b4-a6d6-34b1475ac07c&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-12T12%3A58%3A47Z&ske=2026-11-13T12%3A58%3A47Z&sks=b&skv=2026-06-06&sig=%2BFMRcT1yQhgAcu6g5fd86yGtXv6z%2Biql2a/uukdnCUA%3D'
        run: |
          set -euo pipefail
          mkdir -p dist
          curl --fail --location --retry 3 --silent --show-error "$SOURCE_URL" -o /tmp/MercadoGT250_artifact.zip
          unzip -t /tmp/MercadoGT250_artifact.zip >/dev/null
          unzip -q /tmp/MercadoGT250_artifact.zip -d dist
          test -s dist/MercadoGT_250_COBRO_MEDIDAS_EXACTAS.apk
          test -s dist/MercadoGT_250_COBRO_MEDIDAS_EXACTAS.apk.sha256
          test -s dist/MercadoGT_250_COBRO_MEDIDAS_EXACTAS.apk.cert.sha256
          cd dist
          sed -i 's|dist/||g' MercadoGT_250_COBRO_MEDIDAS_EXACTAS.apk.sha256
          sha256sum -c MercadoGT_250_COBRO_MEDIDAS_EXACTAS.apk.sha256
          test "$(cat MercadoGT_250_COBRO_MEDIDAS_EXACTAS.apk.cert.sha256)" = "abff6095a44e3428073de50b7cd1d8a6c2e3620e3bda58e2431ae489c633453d"
          unzip -t MercadoGT_250_COBRO_MEDIDAS_EXACTAS.apk >/dev/null

      - name: Publicar APK en descarga directa de GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=mercadogt-250
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" dist/MercadoGT_250_COBRO_MEDIDAS_EXACTAS.apk dist/MercadoGT_250_COBRO_MEDIDAS_EXACTAS.apk.sha256 --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Mercado GT 250 — Descargar APK Android" \
              --notes "APK piloto Mercado GT 250 Android, firmado con la clave original de Mercado GT, actualizable sobre la aplicación 249. Corrige medida base y factor automático a partir de Fardo 1/12, Fardo 1/24 y Caja 1/100, precios independientes, descuentos exactos de inventario para unidades y medios fardos, sin cifras decimales largas en pantalla. El cobro no falsifica inventario en la nube; cuando existe una diferencia, el dueño puede registrar SOLO LOCALMENTE bajo confirmación explícita, y conciliarla después con conteo físico auditado. La base de datos de Supabase fue migrada con respaldos privados y precisión de 12 decimales. Conserva la separación Vender/Fiado y sin los 35 negocios eliminados. Antes de instalar, respalda productos, ventas e inventario. Pendiente prueba real en Redmi; no utilices para operaciones irreversibles sin comprobar." \
              --prerelease \
              dist/MercadoGT_250_COBRO_MEDIDAS_EXACTAS.apk \
              dist/MercadoGT_250_COBRO_MEDIDAS_EXACTAS.apk.sha256
          fi
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json url,assets --jq '{url:.url,archivos:[.assets[].name]}'
