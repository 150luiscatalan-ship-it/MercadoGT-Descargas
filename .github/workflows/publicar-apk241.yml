name: Publicar APK firmado Mercado GT 241
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publicar-apk241.yml'

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Descargar APK compilado y certificado
        env:
          SOURCE_URL: 'https://sdmntpreastus3.oaiusercontent.com/files/00000000-430c-8212-9ba5-ef11f4bc7883/raw?se=2026-11-11T02%3A55%3A23Z&sp=r&sv=2026-06-06&sr=b&scid=4d7823a1-f3f7-5672-887e-f58e9ed878b3&skoid=c953efd6-2ae8-41b4-a6d6-34b1475ac07c&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-11T00%3A46%3A35Z&ske=2026-11-12T00%3A46%3A35Z&sks=b&skv=2026-06-06&sig=ZshDu32jtyj/kHi5g01Gt7BVaH2bvno9CywjZcP0SgE%3D'
        run: |
          set -euo pipefail
          mkdir -p dist
          curl --fail --location --retry 3 --silent --show-error "$SOURCE_URL" -o /tmp/MercadoGT241_artifact.zip
          unzip -t /tmp/MercadoGT241_artifact.zip >/dev/null
          unzip -q /tmp/MercadoGT241_artifact.zip -d dist
          test -s dist/MercadoGT_241_TABS_CLIENTES.apk
          test -s dist/MercadoGT_241_TABS_CLIENTES.apk.sha256
          test -s dist/MercadoGT_241_TABS_CLIENTES.apk.cert.sha256
          cd dist
          sed -i 's|dist/||g' MercadoGT_241_TABS_CLIENTES.apk.sha256
          sha256sum -c MercadoGT_241_TABS_CLIENTES.apk.sha256
          test "$(cat MercadoGT_241_TABS_CLIENTES.apk.cert.sha256)" = "abff6095a44e3428073de50b7cd1d8a6c2e3620e3bda58e2431ae489c633453d"
          unzip -t MercadoGT_241_TABS_CLIENTES.apk >/dev/null

      - name: Publicar APK en descarga directa de GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=mercadogt-241
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" dist/MercadoGT_241_TABS_CLIENTES.apk dist/MercadoGT_241_TABS_CLIENTES.apk.sha256 --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Mercado GT 241 — Descargar APK Android" \
              --notes "APK piloto de Mercado GT 241, firmado con la misma clave que Mercado GT 230. Se eliminaron los perfiles de 35 negocios del menú, sin borrar historiales. Respalda tus datos antes de actualizar." \
              --prerelease \
              dist/MercadoGT_241_TABS_CLIENTES.apk \
              dist/MercadoGT_241_TABS_CLIENTES.apk.sha256
          fi
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json url,assets --jq '{url:.url,archivos:[.assets[].name]}'
